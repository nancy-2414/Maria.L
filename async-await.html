<body>
<script>
function getstudent(){
       
      return new Promise(function(resolve){
            console.log("promise is pending...");
            
            setTimeout(function(){
                 resolve("nancy");
            },3000);
      });
}

async function displaystudent()
{
      console.log("Loading Student...");
      let student = await getstudent();
      console.log(student);
      
}
displaystudent();
      </script>
